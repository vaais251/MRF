services:
  app:
    image: node:20-alpine
    init: true
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl libc6-compat
        npm ci
        ./node_modules/.bin/prisma generate
        npm exec --call 'sh ./scripts/migrate-and-seed.sh'
        exec ./node_modules/.bin/next dev --hostname 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://mrt_user:mrt_pass@db:5432/mrt_db?schema=public
      - NEXTAUTH_SECRET=development_secret_do_not_use_in_prod
      - NEXTAUTH_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mrt_user
      POSTGRES_PASSWORD: mrt_pass
      POSTGRES_DB: mrt_db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mrt_user", "-d", "mrt_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
